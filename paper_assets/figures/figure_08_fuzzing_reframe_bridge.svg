  <text x="70" y="72" class="title">If Reframed as Multi-Agent Directed Fuzzing</text><text x="72" y="105" class="subtitle">A bridge design: what must be added beyond the current CHR-CP implementation</text><line x1="70" y1="128" x2="1530" y2="128" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round"/><rect x="90" y="215" width="420" height="470" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/><rect x="90" y="215" width="420" height="14" rx="24" fill="#2563eb"/><text x="122" y="275" font-size="28" font-weight="850" fill="#2563eb">Current CHR-CP</text><circle cx="132" cy="328" r="9" fill="#2563eb"/><text x="156" y="335" font-size="21" fill="#18212f">LLM agents</text><circle cx="132" cy="400" r="9" fill="#2563eb"/><text x="156" y="407" font-size="21" fill="#18212f">uncertainty routing</text><circle cx="132" cy="472" r="9" fill="#2563eb"/><text x="156" y="479" font-size="21" fill="#18212f">cost/cache control</text><circle cx="132" cy="544" r="9" fill="#2563eb"/><text x="156" y="551" font-size="21" fill="#18212f">benchmark QA/code tasks</text><rect x="590" y="215" width="420" height="470" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/><rect x="590" y="215" width="420" height="14" rx="24" fill="#dc2626"/><text x="622" y="275" font-size="28" font-weight="850" fill="#dc2626">Missing fuzzing core</text><circle cx="632" cy="328" r="9" fill="#dc2626"/><text x="656" y="335" font-size="21" fill="#18212f">seed corpus</text><circle cx="632" cy="400" r="9" fill="#dc2626"/><text x="656" y="407" font-size="21" fill="#18212f">mutation operators</text><circle cx="632" cy="472" r="9" fill="#dc2626"/><text x="656" y="479" font-size="21" fill="#18212f">coverage distance</text><circle cx="632" cy="544" r="9" fill="#dc2626"/><text x="656" y="551" font-size="21" fill="#18212f">crash/bug oracle</text><rect x="1090" y="215" width="420" height="470" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/><rect x="1090" y="215" width="420" height="14" rx="24" fill="#16a34a"/><text x="1122" y="275" font-size="28" font-weight="850" fill="#16a34a">CHR-Fuzz target</text><circle cx="1132" cy="328" r="9" fill="#16a34a"/><text x="1156" y="335" font-size="21" fill="#18212f">planner agent</text><circle cx="1132" cy="400" r="9" fill="#16a34a"/><text x="1156" y="407" font-size="21" fill="#18212f">mutator agent</text><circle cx="1132" cy="472" r="9" fill="#16a34a"/><text x="1156" y="479" font-size="21" fill="#18212f">executor agent</text><circle cx="1132" cy="544" r="9" fill="#16a34a"/><text x="1156" y="551" font-size="21" fill="#18212f">triage agent</text><line x1="510" y1="450" x2="590" y2="450" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1010" y1="450" x2="1090" y2="450" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="150" y="760" width="1300" height="94" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="190" y="810" font-size="22" font-weight="850">Recommendation:</text><text x="420" y="810" font-size="21" fill="#64748b">submit current work as API-aware multi-agent routing, unless you can run directed fuzzing experiments before June 13.</text>
</svg>
