<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f8fafc"/>
  
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
      </filter>
      <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
      </marker>
      <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
      </marker>
    </defs>
    
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #18212f; }
    .mono { font-family: Cascadia Mono, Consolas, monospace; }
    .small { font-size: 18px; fill: #64748b; }
    .tiny { font-size: 15px; fill: #64748b; }
    .title { font-size: 36px; font-weight: 760; }
    .subtitle { font-size: 20px; fill: #64748b; }
    .label { font-size: 20px; font-weight: 700; }
    .caption { font-size: 16px; fill: #64748b; }
  </style>
  <text x="70" y="72" class="title">Example Routing Trace</text><text x="72" y="105" class="subtitle">A trace-level case study from the retained completed evaluation artifact</text><line x1="70" y1="128" x2="1530" y2="128" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round"/><circle cx="95" cy="360" r="74" fill="#ffffff" stroke="#2563eb" stroke-width="6"/><text x="95" y="350" font-size="22" font-weight="820" fill="#2563eb" text-anchor="middle">Task</text><text x="95" y="382" font-size="16" font-weight="760" fill="#64748b" text-anchor="middle">input</text><text x="95" y="478" font-size="17" fill="#64748b" text-anchor="middle">MATH problem</text><line x1="169" y1="360" x2="276" y2="360" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="350" cy="360" r="74" fill="#ffffff" stroke="#0891b2" stroke-width="6"/><text x="350" y="350" font-size="22" font-weight="820" fill="#0891b2" text-anchor="middle">L1</text><text x="350" y="382" font-size="16" font-weight="760" fill="#64748b" text-anchor="middle">route</text><text x="350" y="478" font-size="17" fill="#64748b" text-anchor="middle">chain: solver -&gt;</text><text x="350" y="503" font-size="17" fill="#64748b" text-anchor="middle">verifier -&gt; escalator</text><line x1="424" y1="360" x2="531" y2="360" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="605" cy="360" r="74" fill="#ffffff" stroke="#d97706" stroke-width="6"/><text x="605" y="350" font-size="22" font-weight="820" fill="#d97706" text-anchor="middle">Step 1</text><text x="605" y="382" font-size="16" font-weight="760" fill="#64748b" text-anchor="middle">BRANCH</text><text x="605" y="478" font-size="17" fill="#64748b" text-anchor="middle">solver @ T1</text><text x="605" y="503" font-size="17" fill="#64748b" text-anchor="middle">U=0.32</text><line x1="679" y1="360" x2="786" y2="360" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="860" cy="360" r="74" fill="#ffffff" stroke="#dc2626" stroke-width="6"/><text x="860" y="350" font-size="22" font-weight="820" fill="#dc2626" text-anchor="middle">Step 2</text><text x="860" y="382" font-size="16" font-weight="760" fill="#64748b" text-anchor="middle">ESCALATE</text><text x="860" y="478" font-size="17" fill="#64748b" text-anchor="middle">verifier @ T2</text><text x="860" y="503" font-size="17" fill="#64748b" text-anchor="middle">U=0.54</text><line x1="934" y1="360" x2="1041" y2="360" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="1115" cy="360" r="74" fill="#ffffff" stroke="#7c3aed" stroke-width="6"/><text x="1115" y="350" font-size="22" font-weight="820" fill="#7c3aed" text-anchor="middle">L3</text><text x="1115" y="382" font-size="16" font-weight="760" fill="#64748b" text-anchor="middle">switch</text><text x="1115" y="478" font-size="17" fill="#64748b" text-anchor="middle">CADS/CTOR handoff</text><text x="1115" y="503" font-size="17" fill="#64748b" text-anchor="middle">T2 -&gt; T3</text><line x1="1189" y1="360" x2="1296" y2="360" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="1370" cy="360" r="74" fill="#ffffff" stroke="#16a34a" stroke-width="6"/><text x="1370" y="350" font-size="22" font-weight="820" fill="#16a34a" text-anchor="middle">Step 3</text><text x="1370" y="382" font-size="16" font-weight="760" fill="#64748b" text-anchor="middle">FINAL</text><text x="1370" y="478" font-size="17" fill="#64748b" text-anchor="middle">escalator @ T3</text><text x="1370" y="503" font-size="17" fill="#64748b" text-anchor="middle">cache-aware</text><rect x="165" y="620" width="1270" height="110" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/><text x="205" y="665" font-size="23" font-weight="820">Why this figure matters</text><text x="205" y="700" font-size="20" fill="#64748b">It makes CHR-CP&#x27;s decisions auditable: each action is tied to U, thresholds, tier, and handoff state.</text><path d="M1125 434 C1125 530 1010 545 1000 620" stroke="#7c3aed" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8" marker-end="url(#arrow)"/><text x="1030" y="548" font-size="17" fill="#7c3aed">cache-preserved switch</text>
</svg>
