<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <rect width="1600" height="1040" fill="#f8fafc"/>
  
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
      </filter>
      <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
      </marker>
      <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
      </marker>
    </defs>
    
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #18212f; }
    .mono { font-family: Cascadia Mono, Consolas, monospace; }
    .small { font-size: 18px; fill: #64748b; }
    .tiny { font-size: 15px; fill: #64748b; }
    .title { font-size: 36px; font-weight: 760; }
    .subtitle { font-size: 20px; fill: #64748b; }
    .label { font-size: 20px; font-weight: 700; }
    .caption { font-size: 16px; fill: #64748b; }
  </style>
  <text x="70" y="72" class="title">CHR-CP System Overview</text><text x="72" y="105" class="subtitle">Confidence-gated multi-agent routing with cache-preserved switching under API constraints</text><line x1="70" y1="128" x2="1530" y2="128" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round"/><rect x="70" y="180" width="260" height="160" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/><rect x="70" y="180" width="8" height="160" rx="18" fill="#2563eb"/><text x="98" y="218" class="label" fill="#18212f">Input Task</text><text x="98" y="252" font-size="17" fill="#64748b">Problem text</text><text x="98" y="277" font-size="17" fill="#64748b">budget cap</text><text x="98" y="302" font-size="17" fill="#64748b">benchmark type</text><line x1="330" y1="260" x2="405" y2="260" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="405" y="165" width="300" height="190" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/><rect x="405" y="165" width="8" height="190" rx="18" fill="#0891b2"/><text x="433" y="203" class="label" fill="#18212f">L0 / L1 Routing</text><text x="433" y="237" font-size="17" fill="#64748b">difficulty probe</text><text x="433" y="262" font-size="17" fill="#64748b">task category</text><text x="433" y="287" font-size="17" fill="#64748b">agent chain and start tier</text><line x1="705" y1="260" x2="780" y2="260" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="780" y="155" width="360" height="220" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/><rect x="780" y="155" width="8" height="220" rx="18" fill="#7c3aed"/><text x="808" y="193" class="label" fill="#18212f">L2 Step Routing</text><text x="808" y="227" font-size="17" fill="#64748b">primary agent call</text><text x="808" y="252" font-size="17" fill="#64748b">VC2 uncertainty U</text><text x="808" y="277" font-size="17" fill="#64748b">STAY / BRANCH / ESCALATE</text><line x1="1140" y1="260" x2="1215" y2="260" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1215" y="165" width="315" height="190" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/><rect x="1215" y="165" width="8" height="190" rx="18" fill="#d97706"/><text x="1243" y="203" class="label" fill="#18212f">L3 Switching</text><text x="1243" y="237" font-size="17" fill="#64748b">stable prefix</text><text x="1243" y="262" font-size="17" fill="#64748b">CADS distillation</text><text x="1243" y="287" font-size="17" fill="#64748b">CTOR handoff</text><rect x="770" y="430" width="780" height="360" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/><text x="810" y="480" class="label">Step-level decision kernel</text><rect x="812" y="515" width="220" height="48" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="922.0" y="546.0" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="middle">VC2: U signal</text><rect x="1060" y="515" width="250" height="48" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="1185.0" y="546.0" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">CA2R thresholds</text><rect x="1338" y="515" width="160" height="48" rx="24" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/><text x="1418.0" y="546.0" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Budget</text><line x1="1032" y1="539" x2="1060" y2="539" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1310" y1="539" x2="1338" y2="539" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="820" y="605" width="205" height="96" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><text x="922" y="646" font-size="25" font-weight="800" fill="#16a34a" text-anchor="middle">STAY</text><text x="922" y="675" font-size="16" fill="#64748b" text-anchor="middle">accept current tier</text><rect x="1065" y="605" width="205" height="96" rx="16" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/><text x="1168" y="646" font-size="25" font-weight="800" fill="#d97706" text-anchor="middle">BRANCH</text><text x="1168" y="675" font-size="16" fill="#64748b" text-anchor="middle">verify / vote</text><rect x="1310" y="605" width="205" height="96" rx="16" fill="#fee2e2" stroke="#fecaca" stroke-width="1.5"/><text x="1412" y="646" font-size="25" font-weight="800" fill="#dc2626" text-anchor="middle">ESCALATE</text><text x="1412" y="675" font-size="16" fill="#64748b" text-anchor="middle">move up ladder</text><rect x="70" y="430" width="635" height="360" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/><text x="110" y="480" class="label">API-visible evidence only</text><text x="110" y="525" font-size="20" fill="#64748b">No logprobs required for reasoning APIs</text><text x="110" y="563" font-size="20" fill="#64748b">Verbalized confidence: &lt;confidence&gt;X.X/10&lt;/confidence&gt;</text><text x="110" y="601" font-size="20" fill="#64748b">Consistency: K lightweight verification samples</text><text x="110" y="639" font-size="20" fill="#64748b">Cache events: hit tokens, total tokens, provider boundary</text><rect x="110" y="700" width="170" height="48" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="195.0" y="731.0" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">black-box</text><rect x="300" y="700" width="165" height="48" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="382.5" y="731.0" font-size="18" font-weight="700" fill="#16a34a" text-anchor="middle">traceable</text><rect x="485" y="700" width="170" height="48" rx="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="570.0" y="731.0" font-size="18" font-weight="700" fill="#d97706" text-anchor="middle">cost-aware</text><path d="M1375 355 C1375 420 1375 420 1375 500" stroke="#d97706" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M1380 790 C1380 900 970 900 970 720" stroke="#2563eb" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 8" marker-end="url(#arrow-blue)"/><text x="1000" y="828" font-size="18" fill="#2563eb">cache events feed back into adaptive thresholds</text><line x1="1350" y1="355" x2="1350" y2="415" stroke="#d97706" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1080" y="845" width="450" height="120" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/><rect x="1080" y="845" width="8" height="120" rx="18" fill="#16a34a"/><text x="1108" y="883" class="label" fill="#18212f">Output Trace</text><text x="1108" y="917" font-size="17" fill="#64748b">final answer, final tier, action distribution</text><text x="1108" y="942" font-size="17" fill="#64748b">cost, latency, cache statistics</text>
</svg>
