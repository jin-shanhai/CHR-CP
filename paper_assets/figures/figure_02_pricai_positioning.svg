<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <rect width="1400" height="1000" fill="#f8fafc"/>
  
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
      </filter>
      <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
      </marker>
      <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
      </marker>
    </defs>
    
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #18212f; }
    .mono { font-family: Cascadia Mono, Consolas, monospace; }
    .small { font-size: 18px; fill: #64748b; }
    .tiny { font-size: 15px; fill: #64748b; }
    .title { font-size: 36px; font-weight: 760; }
    .subtitle { font-size: 20px; fill: #64748b; }
    .label { font-size: 20px; font-weight: 700; }
    .caption { font-size: 16px; fill: #64748b; }
  </style>
  <text x="70" y="72" class="title">Positioning for PRICAI</text><text x="72" y="105" class="subtitle">The current project is strongest as API-aware multi-agent LLM routing, not as directed fuzzing yet</text><line x1="70" y1="128" x2="1330" y2="128" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round"/><rect x="180" y="190" width="1040" height="660" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/><rect x="752.0" y="190" width="468.0" height="316.8" rx="22" fill="#dbeafe" opacity="0.82"/><rect x="752.0" y="190" width="540.8" height="316.8" rx="0" fill="none"/><line x1="250" y1="780" x2="1150" y2="780" stroke="#334155" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="250" y1="780" x2="250" y2="260" stroke="#334155" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="430.0" y1="260" x2="430.0" y2="780" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="250" y1="676.0" x2="1150" y2="676.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="610.0" y1="260" x2="610.0" y2="780" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="250" y1="572.0" x2="1150" y2="572.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="790.0" y1="260" x2="790.0" y2="780" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="250" y1="468.0" x2="1150" y2="468.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="970.0" y1="260" x2="970.0" y2="780" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="250" y1="364.0" x2="1150" y2="364.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="700.0" y="832" font-size="22" font-weight="760" text-anchor="middle">API and cache awareness</text><text x="110" y="520.0" transform="rotate(-90 110 520.0)" font-size="22" font-weight="760">routing granularity</text><text x="970" y="282" font-size="21" font-weight="760" fill="#2563eb">open gap</text><text x="970" y="313" font-size="17" fill="#2563eb">fine-grained + API/cache-aware</text><circle cx="448.0" cy="655.2" r="18" fill="#ffffff" stroke="#334155" stroke-width="3"/><text x="476.0" y="662.2" font-size="20" font-weight="680">FrugalGPT</text><circle cx="502.0" cy="572.0" r="18" fill="#ffffff" stroke="#334155" stroke-width="3"/><text x="530.0" y="579.0" font-size="20" font-weight="680">AgentRouter</text><circle cx="610.0" cy="478.4" r="18" fill="#ffffff" stroke="#334155" stroke-width="3"/><text x="638.0" y="485.4" font-size="20" font-weight="680">OI-MAS</text><circle cx="520.0" cy="426.4" r="18" fill="#ffffff" stroke="#334155" stroke-width="3"/><text x="548.0" y="433.4" font-size="20" font-weight="680">SC-MAS</text><circle cx="772.0" cy="530.4" r="18" fill="#ffffff" stroke="#334155" stroke-width="3"/><text x="800.0" y="537.4" font-size="20" font-weight="680">AgentCollab</text><circle cx="1024.0" cy="332.8" r="28" fill="#2563eb" stroke="#ffffff" stroke-width="5"/><text x="1064.0" y="320.8" font-size="30" font-weight="850" fill="#2563eb">CHR-CP</text><text x="1064.0" y="350.8" font-size="18" fill="#2563eb">ours</text><rect x="180" y="885" width="1040" height="54" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="210" y="920" font-size="19" font-weight="760" fill="#18212f">Submission framing:</text><text x="395" y="920" font-size="18" fill="#64748b">Agents + Large Language Models + Cost-sensitive AI systems. Directed fuzzing needs extra coverage/crash evidence.</text>
</svg>
