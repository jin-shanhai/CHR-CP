  <text x="70" y="72" class="title">Four-Tier Model Ladder and Cache Boundaries</text><text x="72" y="105" class="subtitle">Economic structure behind routing: capability rises, cost rises, and cache validity changes at provider boundaries</text><line x1="70" y1="128" x2="1530" y2="128" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round"/><rect x="90" y="220" width="320" height="430" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/><rect x="90" y="220" width="320" height="14" rx="24" fill="#16a34a"/><text x="118" y="282" font-size="34" font-weight="880" fill="#16a34a">T1</text><text x="118" y="318" font-size="20" font-weight="760">qwen-turbo</text><text x="118" y="348" font-size="16" fill="#64748b">Qwen / non-thinking</text><text x="118" y="405" font-size="16" font-weight="760">Input $/M</text><text x="258" y="405" font-size="18" fill="#64748b">$0.04</text><text x="118" y="448" font-size="16" font-weight="760">Output $/M</text><text x="258" y="448" font-size="18" fill="#64748b">$0.085</text><rect x="118" y="480" width="240" height="24" rx="8" fill="#e2e8f0"/><rect x="118" y="480" width="5.7" height="24" rx="8" fill="#16a34a"/><rect x="118" y="546" width="230" height="44" rx="22" fill="#f8fafc" stroke="#16a34a" stroke-width="1.4"/><text x="233.0" y="575.0" font-size="18" font-weight="700" fill="#16a34a" text-anchor="middle">no listed discount</text><rect x="458" y="220" width="320" height="430" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/><rect x="458" y="220" width="320" height="14" rx="24" fill="#0891b2"/><text x="486" y="282" font-size="34" font-weight="880" fill="#0891b2">T2</text><text x="486" y="318" font-size="20" font-weight="760">deepseek-v4-flash</text><text x="486" y="348" font-size="16" fill="#64748b">DeepSeek / thinking</text><text x="486" y="405" font-size="16" font-weight="760">Input $/M</text><text x="626" y="405" font-size="18" fill="#64748b">$0.14</text><text x="486" y="448" font-size="16" font-weight="760">Output $/M</text><text x="626" y="448" font-size="18" fill="#64748b">$0.28</text><rect x="486" y="480" width="240" height="24" rx="8" fill="#e2e8f0"/><rect x="486" y="480" width="17.25" height="24" rx="8" fill="#0891b2"/><rect x="486" y="546" width="230" height="44" rx="22" fill="#f8fafc" stroke="#0891b2" stroke-width="1.4"/><text x="601.0" y="575.0" font-size="18" font-weight="700" fill="#0891b2" text-anchor="middle">75% cache discount</text><rect x="826" y="220" width="320" height="430" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/><rect x="826" y="220" width="320" height="14" rx="24" fill="#2563eb"/><text x="854" y="282" font-size="34" font-weight="880" fill="#2563eb">T3</text><text x="854" y="318" font-size="20" font-weight="760">deepseek-v4-pro</text><text x="854" y="348" font-size="16" fill="#64748b">DeepSeek / thinking</text><text x="854" y="405" font-size="16" font-weight="760">Input $/M</text><text x="994" y="405" font-size="18" fill="#64748b">$0.44</text><text x="854" y="448" font-size="16" font-weight="760">Output $/M</text><text x="994" y="448" font-size="18" fill="#64748b">$2.75</text><rect x="854" y="480" width="240" height="24" rx="8" fill="#e2e8f0"/><rect x="854" y="480" width="92.38" height="24" rx="8" fill="#2563eb"/><rect x="854" y="546" width="230" height="44" rx="22" fill="#f8fafc" stroke="#2563eb" stroke-width="1.4"/><text x="969.0" y="575.0" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">75% cache discount</text><rect x="1194" y="220" width="320" height="430" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/><rect x="1194" y="220" width="320" height="14" rx="24" fill="#dc2626"/><text x="1222" y="282" font-size="34" font-weight="880" fill="#dc2626">T4</text><text x="1222" y="318" font-size="20" font-weight="760">gpt-5.5</text><text x="1222" y="348" font-size="16" fill="#64748b">OpenAI / non-thinking</text><text x="1222" y="405" font-size="16" font-weight="760">Input $/M</text><text x="1362" y="405" font-size="18" fill="#64748b">$5</text><text x="1222" y="448" font-size="16" font-weight="760">Output $/M</text><text x="1362" y="448" font-size="18" fill="#64748b">$30</text><rect x="1222" y="480" width="240" height="24" rx="8" fill="#e2e8f0"/><rect x="1222" y="480" width="240.0" height="24" rx="8" fill="#dc2626"/><rect x="1222" y="546" width="230" height="44" rx="22" fill="#f8fafc" stroke="#dc2626" stroke-width="1.4"/><text x="1337.0" y="575.0" font-size="18" font-weight="700" fill="#dc2626" text-anchor="middle">50% cache discount</text><line x1="427" y1="689" x2="427" y2="759" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><text x="427" y="794" font-size="17" fill="#dc2626" text-anchor="middle">cross-vendor</text><line x1="795" y1="689" x2="795" y2="759" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/><text x="795" y="794" font-size="17" fill="#16a34a" text-anchor="middle">same vendor</text><line x1="1163" y1="689" x2="1163" y2="759" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><text x="1163" y="794" font-size="17" fill="#dc2626" text-anchor="middle">cross-vendor</text><rect x="120" y="825" width="1360" height="74" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="155" y="870" font-size="20" font-weight="820">Design implication:</text><text x="345" y="870" font-size="20" fill="#64748b">the router should not only ask whether a stronger model is needed, but also whether switching will destroy cache value.</text>
